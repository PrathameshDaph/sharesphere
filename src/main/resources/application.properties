# Server
server.port=8080

# Database (Defaults to H2 in-memory for instant 0-config startup, override via DB_URL for MySQL)
spring.datasource.url=${DB_URL:jdbc:h2:mem:sharesphere;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:sharesphere-super-secret-key-that-is-at-least-256-bits-long-for-hs256-algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

# AI
app.ai.api-key=${AI_API_KEY:}
app.ai.enabled=${AI_ENABLED:false}

# Logging
logging.level.com.sharesphere=INFO
logging.level.org.springframework.security=WARN

# Application
app.name=ShareSphere
app.version=1.0.0
