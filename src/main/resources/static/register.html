<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Register — ShareSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-left">
    <div class="auth-brand"><span class="logo-icon">🌐</span><span class="logo-text">ShareSphere</span></div>
    <h2>Join Your Campus Marketplace</h2>
    <p>Register once, access everything your college needs.</p>
    <div class="auth-features">
      <div class="auth-feature"><span>🛒</span> Buy &amp; Sell items</div>
      <div class="auth-feature"><span>🔄</span> Rent &amp; Lend</div>
      <div class="auth-feature"><span>💬</span> Chat with sellers</div>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-card">
      <h2>Create Account</h2>
      <div id="authError" class="alert alert-error hidden"></div>
      <form id="registerForm">
        <div class="form-row">
          <div class="form-group"><label>Full Name</label><input type="text" id="name" placeholder="Rahul Sharma" required class="form-control"></div>
          <div class="form-group"><label>Email</label><input type="email" id="email" placeholder="rahul@college.edu" required class="form-control"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Password</label><input type="password" id="password" placeholder="Min 6 chars" required class="form-control"></div>
          <div class="form-group"><label>Phone</label><input type="text" id="phone" placeholder="9876543210" class="form-control"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>College/University</label><input type="text" id="college" placeholder="IIT Campus" class="form-control"></div>
          <div class="form-group"><label>Location / Hostel</label><input type="text" id="location" placeholder="Hostel A" class="form-control"></div>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
      </form>
      <p class="auth-switch">Already have an account? <a href="/login.html">Sign in</a></p>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body></html>
