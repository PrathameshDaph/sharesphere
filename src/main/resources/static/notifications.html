<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications — ShareSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar"><div class="nav-brand"><a href="/"><span class="logo-icon">🌐</span><span class="logo-text">ShareSphere</span></a></div>
<div class="nav-links"><a href="/dashboard.html">Dashboard</a></div>
<div class="nav-actions" id="navActions"></div></nav>
<div class="page-container">
  <div class="page-header"><h2>🔔 Notifications</h2><button onclick="markAllRead()" class="btn btn-ghost btn-sm">Mark All Read</button></div>
  <div id="notifList"></div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="/js/api.js"></script><script src="/js/app.js"></script>
<script>
requireAuth();
async function loadNotifs() {
  const notifs = await API.get('/api/notifications');
  document.getElementById('notifList').innerHTML = notifs.length ? notifs.map(n => `
    <div class="notif-item ${n.read?'':'notif-unread'}" onclick="readNotif(${n.id})">
      <div class="notif-icon">${getNotifIcon(n.type)}</div>
      <div class="notif-body"><strong>${n.title}</strong><p>${n.message}</p><small>${new Date(n.createdAt).toLocaleString()}</small></div>
    </div>`).join('') : '<div class="empty-state"><p>No notifications yet</p></div>';
}
function getNotifIcon(type) {
  const map = {RENTAL_REQUEST:'📬',RENTAL_ACCEPTED:'✅',RENTAL_REJECTED:'❌',RENTAL_ACTIVE:'🔑',RENTAL_COMPLETED:'🎉',ORDER_PLACED:'🛒',ITEM_SOLD:'💰',NEW_MESSAGE:'💬',NEW_REVIEW:'⭐'};
  return map[type]||'🔔';
}
async function readNotif(id) { await API.post(`/api/notifications/${id}/read`); loadNotifs(); }
async function markAllRead() { await API.post('/api/notifications/read-all'); showToast('All marked as read','success'); loadNotifs(); }
loadNotifs(); updateNavForAuth();
</script>
</body></html>
