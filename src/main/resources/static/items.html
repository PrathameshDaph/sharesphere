<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse Items — ShareSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="navbar">
  <div class="nav-brand"><a href="/"><span class="logo-icon">🌐</span><span class="logo-text">ShareSphere</span></a></div>
  <div class="nav-links" id="navLinks"></div>
  <div class="nav-actions" id="navActions"></div>
</nav>

<div class="browse-layout">
  <!-- Filters Sidebar -->
  <aside class="filters-sidebar">
    <h3>Filters</h3>
    <div class="filter-group">
      <label>Category</label>
      <select id="filterCategory" class="form-control" onchange="applyFilters()">
        <option value="">All Categories</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Listing Type</label>
      <select id="filterType" class="form-control" onchange="applyFilters()">
        <option value="">All Types</option>
        <option value="SELL">For Sale</option>
        <option value="RENT">For Rent</option>
        <option value="LEND">For Lending</option>
        <option value="SELL_AND_RENT">Sale &amp; Rent</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Condition</label>
      <select id="filterCondition" class="form-control" onchange="applyFilters()">
        <option value="">Any Condition</option>
        <option>New</option><option>Like New</option><option>Good</option><option>Fair</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Min Price (₹)</label>
      <input type="number" id="filterMinPrice" class="form-control" placeholder="0" oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <label>Max Price (₹)</label>
      <input type="number" id="filterMaxPrice" class="form-control" placeholder="50000" oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <label>Location</label>
      <input type="text" id="filterLocation" class="form-control" placeholder="e.g. Hostel A" oninput="applyFilters()">
    </div>
    <div class="filter-group">
      <label>Sort By</label>
      <select id="sortBy" class="form-control" onchange="applyFilters()">
        <option value="newest">Newest First</option>
        <option value="popular">Most Popular</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
      </select>
    </div>
    <button onclick="clearFilters()" class="btn btn-ghost btn-sm">Clear Filters</button>
  </aside>

  <!-- Main Content -->
  <main class="browse-main">
    <div class="browse-top">
      <div class="search-bar-row">
        <input type="text" id="searchKeyword" class="form-control search-input" placeholder="Search items...">
        <button onclick="applyFilters()" class="btn btn-primary">Search</button>
        <button onclick="toggleAI()" class="btn btn-secondary" id="aiToggleBtn">🤖 AI Mode</button>
      </div>
      <div id="aiSearchPanel" class="ai-panel hidden">
        <input type="text" id="aiSearchInput" class="form-control" placeholder='Natural language: "camera for 3 days near hostel"'>
        <button onclick="runAISearch()" class="btn btn-primary">🤖 Ask AI</button>
        <div class="ai-suggestion" id="browseAiSuggestion"></div>
      </div>
    </div>
    <div class="browse-results-header">
      <span id="resultCount">Loading...</span>
    </div>
    <div class="items-grid" id="itemsGrid"></div>
    <div class="pagination" id="pagination"></div>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/items.js"></script>
</body></html>
