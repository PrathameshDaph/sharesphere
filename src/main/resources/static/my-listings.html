<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Listings — ShareSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="nav-brand"><a href="index.html"><span class="logo-icon">🌐</span><span class="logo-text">ShareSphere</span></a></div>
<div class="nav-links"><a href="dashboard.html">Dashboard</a><a href="add-item.html">+ Add Item</a></div>
<div class="nav-actions" id="navActions"></div></nav>
<div class="page-container">
  <div class="page-header"><h2>📦 My Listings</h2><a href="add-item.html" class="btn btn-primary">+ List New Item</a></div>
  <div class="items-grid" id="myListingsGrid"></div>
  <div id="emptyState" class="empty-state hidden"><div class="empty-icon">📦</div><h3>No listings yet</h3><p>Start selling or renting your unused items!</p><a href="add-item.html" class="btn btn-primary">List First Item</a></div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="js/api.js"></script><script src="js/app.js"></script>
<script>
requireAuth();
async function loadMyListings() {
  const items = await API.get('/api/items/my');
  const grid = document.getElementById('myListingsGrid');
  if (!items || !items.length) { document.getElementById('emptyState').classList.remove('hidden'); return; }
  grid.innerHTML = items.map(i => `
    <div class="item-card">
      <div class="item-image-wrap">
        <img src="${i.imageUrls?.[0] || 'images/placeholder.svg'}" alt="${i.name}" onerror="this.src='images/placeholder.svg'">
        <span class="item-badge badge-${(i.status||'').toLowerCase()}">${i.status}</span>
      </div>
      <div class="item-body">
        <h3>${i.name}</h3>
        <div class="item-meta">${i.category?.icon||''} ${i.category?.name||''} · ${i.condition}</div>
        <div class="item-price">${formatPrice(i)}</div>
        <div class="item-footer">
          <span class="item-type type-${(i.listingType||'').toLowerCase()}">${i.listingType}</span>
          <div class="item-actions">
            <button onclick="editItem(${i.id})" class="btn btn-ghost btn-sm">Edit</button>
            <button onclick="deleteItem(${i.id})" class="btn btn-danger btn-sm">Delete</button>
          </div>
        </div>
      </div>
    </div>`).join('');
}
function editItem(id) { window.location = `add-item.html?edit=${id}`; }
async function deleteItem(id) {
  if (!confirm('Delete this listing?')) return;
  await API.delete(`/api/items/${id}`);
  showToast('Deleted!', 'success');
  loadMyListings();
}
loadMyListings(); updateNavForAuth();
</script>
</body></html>
