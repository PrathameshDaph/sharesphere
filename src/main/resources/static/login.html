<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — ShareSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
<div class="auth-container">
  <div class="auth-left">
    <div class="auth-brand"><span class="logo-icon">🌐</span><span class="logo-text">ShareSphere</span></div>
    <h2>Welcome Back!</h2>
    <p>Access your campus marketplace. Buy, rent and share with fellow students.</p>
    <div class="auth-features">
      <div class="auth-feature"><span>🤖</span> AI-powered search</div>
      <div class="auth-feature"><span>🔒</span> Secure transactions</div>
      <div class="auth-feature"><span>⭐</span> Verified students</div>
    </div>
  </div>
  <div class="auth-right">
    <div class="auth-card">
      <h2>Sign In</h2>
      <p class="auth-sub">Enter your credentials to continue</p>
      <div id="authError" class="alert alert-error hidden"></div>
      <form id="loginForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="email" placeholder="rahul@college.edu" required class="form-control">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="password" placeholder="••••••••" required class="form-control">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="loginBtn">Sign In</button>
      </form>
      <div class="auth-divider"><span>Demo Credentials</span></div>
      <div class="demo-creds">
        <button onclick="fillCreds('rahul@college.edu','Student@123')" class="btn btn-ghost btn-sm">Student Login</button>
        <button onclick="fillCreds('admin@sharesphere.com','Admin@123')" class="btn btn-ghost btn-sm">Admin Login</button>
      </div>
      <p class="auth-switch">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </div>
</div>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body></html>
