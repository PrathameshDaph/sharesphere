<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Messages — ShareSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar"><div class="nav-brand"><a href="index.html"><span class="logo-icon">🌐</span><span class="logo-text">ShareSphere</span></a></div>
<div class="nav-links"><a href="dashboard.html">Dashboard</a></div>
<div class="nav-actions" id="navActions"></div></nav>
<div class="messages-layout">
  <div class="conversations-panel" id="convPanel">
    <div class="conv-header"><h3>💬 Conversations</h3></div>
    <div id="convList"></div>
  </div>
  <div class="chat-panel" id="chatPanel">
    <div class="chat-header" id="chatHeader"><p>Select a conversation</p></div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row" id="chatInputRow" style="display:none">
      <input type="text" id="msgInput" class="form-control" placeholder="Type a message..." onkeydown="if(event.key==='Enter')sendMsg()">
      <button onclick="sendMsg()" class="btn btn-primary">Send</button>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>
<script src="js/api.js"></script><script src="js/app.js"></script>
<script>
requireAuth();
let currentConvId = null, currentReceiverId = null;
const me = JSON.parse(localStorage.getItem('ss_user')||'{}');
async function loadConversations() {
  const convs = await API.get('/api/conversations').catch(()=>[]);
  document.getElementById('convList').innerHTML = (convs||[]).map(c => {
    const other = c.participant1?.id === me.userId ? c.participant2 : c.participant1;
    return `<div class="conv-item ${c.id===currentConvId?'active':''}" onclick="openConv(${c.id},${other?.id},'${other?.name}')">
      <div class="conv-avatar">${(other?.name||'U')[0]}</div>
      <div class="conv-info"><strong>${other?.name||'Student'}</strong><small>${c.lastMessage?.content?.substring(0,40)||'...'}</small></div>
      ${c.unreadCount > 0 ? `<span class="badge">${c.unreadCount}</span>` : ''}
    </div>`;
  }).join('') || '<p style="padding:1rem;color:#888">No conversations yet</p>';
}
async function openConv(convId, receiverId, name) {
  currentConvId = convId; currentReceiverId = receiverId;
  document.getElementById('chatHeader').innerHTML = `<strong>💬 ${name}</strong>`;
  document.getElementById('chatInputRow').style.display = 'flex';
  const msgs = await API.get(`/api/conversations/${convId}/messages`).catch(()=>[]);
  document.getElementById('chatMessages').innerHTML = (msgs||[]).map(m => `
    <div class="msg-bubble ${m.sender?.id===me.userId?'msg-me':'msg-them'}">
      <p>${m.content}</p><small>${new Date(m.sentAt||Date.now()).toLocaleTimeString()}</small>
    </div>`).join('');
  document.getElementById('chatMessages').scrollTop = 999999;
  loadConversations();
}
async function sendMsg() {
  const content = document.getElementById('msgInput').value.trim();
  if (!content || !currentReceiverId) return;
  await API.post('/api/messages', { receiverId: currentReceiverId, content });
  document.getElementById('msgInput').value = '';
  openConv(currentConvId, currentReceiverId, '');
}
loadConversations(); updateNavForAuth();
// Auto-open from URL param
const params = new URLSearchParams(location.search);
if (params.get('with')) {
  API.get(`/api/conversations/with/${params.get('with')}`).then(c => {
    if (!c) return;
    const other = c.participant1?.id === me.userId ? c.participant2 : c.participant1;
    openConv(c.id, other?.id, other?.name);
  }).catch(()=>{});
}
</script>
</body></html>
